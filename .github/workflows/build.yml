name: 🏭 Build

on:
  push:
    branches:
    - main
    - 'v*.*'
    - validate/*
  pull_request:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BUILDCONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages/

jobs:
  linux:
    name: 🏭 Linux
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        submodules: true
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites
        dotnet --info
      shell: pwsh

    - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      name: ⚙️ Install cargo-binstall

    - run: cargo binstall -y cross@0.2.5 --locked
      name: ⚙️ install cross

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      name: 💾 Cache rust
      with:
        workspaces: |
          src/nerdbank-zcash-rust
        cache-directories: |
          src/nerdbank-zcash-rust/target-host

    - uses: ./.github/actions/cargo
      with:
        test_target: x86_64-unknown-linux-gnu
        checks: true
      name: 🛠️ Cargo build and test
      env:
        CARGO_TARGET_DIR: target-host

    - run: cross build -r --target=aarch64-unknown-linux-gnu
      name: 🛠️ build linux-arm64
      working-directory: src/nerdbank-zcash-rust

    - name: 📢 Publish artifacts
      uses: ./.github/actions/publish-artifacts
      with:
        suffix: linux
      if: cancelled() == false

  macos:
    name: 🏭 macOS
    runs-on: macOS-15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        submodules: true
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites
        dotnet --info
      shell: pwsh

    - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      name: ⚙️ Install cargo-binstall

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      name: 💾 Cache rust
      with:
        workspaces: |
          src/nerdbank-zcash-rust

    - uses: ./.github/actions/cargo
      with:
        test_target: x86_64-apple-darwin
      name: 🛠️ Cargo build and test

    - name: 📱 iOS Framework
      shell: pwsh
      run: |
        Write-Host "##[command]./tools/build_ios_framework.ps1"
        ./tools/build_ios_framework.ps1

    - name: 🛠 dotnet build
      run: dotnet build -t:build,publish --no-restore -c ${{ env.BUILDCONFIGURATION }} -warnAsError -warnNotAsError:NU1901,NU1902,NU1903,NU1904 /bl:"${{ runner.temp }}/_artifacts/build_logs/build.binlog"
      working-directory: .github

    - name: 🧪 test
      run: tools/dotnet-test-cloud.ps1 -Configuration ${{ env.BUILDCONFIGURATION }} -Agent ${{ runner.os }} -IncludeNativeAOT
      shell: pwsh

    - name: 📢 Publish artifacts
      uses: ./.github/actions/publish-artifacts
      with:
        suffix: macOS
      if: cancelled() == false

  windows:
    name: 🏭 Windows
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        submodules: true
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites -NoNuGetCredProvider
        dotnet --info

        # For optimizing Blazor WebAssembly builds
        dotnet workload install wasm-tools

        iex (iwr "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1").Content
      shell: pwsh

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      name: 💾 Cache rust
      with:
        workspaces: |
          src/nerdbank-zcash-rust

    - uses: ./.github/actions/cargo
      with:
        test_target: x86_64-pc-windows-msvc
      name: 🛠️ Cargo build and test

    - name: 🛠 dotnet build
      run: dotnet build .github -t:build,publish --no-restore -c ${{ env.BUILDCONFIGURATION }} -warnAsError -warnNotAsError:NU1901,NU1902,NU1903,NU1904 /bl:"${{ runner.temp }}/_artifacts/build_logs/build.binlog"

    - name: 🧪 test
      run: tools/dotnet-test-cloud.ps1 -Configuration ${{ env.BUILDCONFIGURATION }} -Agent ${{ runner.os }} -IncludeNativeAOT
      shell: pwsh

    - name: ⚙ Update pipeline variables based on build outputs
      run: tools/variables/_define.ps1
      shell: pwsh

    - name: 📢 Publish artifacts
      uses: ./.github/actions/publish-artifacts
      with:
        suffix: Windows
      if: cancelled() == false

    - name: 📢 Publish code coverage results to codecov.io
      run: |
        if ('${{ secrets.CODECOV_TOKEN }}') {
          ./tools/publish-CodeCov.ps1 -CodeCovToken '${{ secrets.CODECOV_TOKEN }}' -PathToCodeCoverage "${{ runner.temp }}/_artifacts/coverageResults" -Name "${{ runner.os }} Coverage Results" -Flags "${{ runner.os }}"
        }
      shell: pwsh
      timeout-minutes: 3

  android:
    name: 🏭 Android
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        submodules: true
    - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      name: ⚙️ Install cargo-binstall
    - run: ./tools/Install-AndroidBuildTools.ps1
      shell: pwsh
      name: ⚙️ Install Android tooling
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      name: 💾 Cache rust
      with:
        workspaces: |
          src/nerdbank-zcash-rust
    - run: ./build_all.ps1 -AndroidEmulatorOnly -AndroidDeviceOnly -Release -SkipCsBindings
      shell: pwsh
      working-directory: src/nerdbank-zcash-rust
      name: 🛠️ build android
    - name: 📢 Publish artifacts
      uses: ./.github/actions/publish-artifacts
      with:
        suffix: android
      if: cancelled() == false

  licenses:
    name: ⚖️ Licenses
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        submodules: true

    - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      name: ⚙️ Install cargo-binstall

    - run: src/nerdbank-zcash-rust/Generate-3rdPartyNotices.ps1
      name: 🪪 3rd party licenses
      shell: pwsh

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: 3rdPartyNotices
        path: obj/src/nerdbank-zcash-rust

  pack:
    name: 📦 Pack
    needs:
    - windows
    - macos
    - linux
    - android
    - licenses
    runs-on: windows-2025 # Must not be linux because linux cannot build net8.0-ios targets.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        submodules: true
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites -NoRust
        dotnet --info
      shell: pwsh

    - name: 🔻 Download Windows binaries
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rust-Windows
        path: target
    - name: 🔻 Download Linux binaries
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rust-linux
        path: target
    - name: 🔻 Download android binaries
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rust-android
        path: target
    - name: 🔻 Download macOS binaries
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rust-macOS
        path: target
    - name: 🔻 Download ios_framework binaries
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ios_framework-macOS
        path: bin/release/nerdbank_zcash_rust.xcframework
    - name: 🔻 Download 3rdPartyNotices
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: 3rdPartyNotices
        path: obj/src/nerdbank-zcash-rust

    - run: dotnet pack -c ${{ env.BUILDCONFIGURATION }} -warnaserror /bl:"${{ runner.temp }}/_artifacts/build_logs/pack.binlog"
      working-directory: .github
      name: 🛠 pack

    - name: 📢 Upload deployables
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: deployables
        path: bin/Packages/${{ env.BUILDCONFIGURATION }}

    - name: 📦 Push CI package
      shell: pwsh
      run: dotnet nuget push bin\Packages\${{ env.BUILDCONFIGURATION }}\NuGet\*.nupkg -s https://nuget.pkg.github.com/nerdcash/index.json -k ${{ secrets.GITHUB_TOKEN }}
      if: success() && github.event_name != 'pull_request'
      continue-on-error: true

  azure_artifacts:
    name: 📦 Azure Artifacts
    needs: pack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: public-ci
    permissions:
      actions: read # Download the pack job's deployables artifact
      contents: read
      id-token: write # Azure Entra OIDC authentication
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: 🔻 Download deployables
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: deployables
        path: deployables

    - name: ⚙ Install .NET SDK
      shell: pwsh
      run: |
        ./tools/Install-DotNetSdk.ps1 -SdkOnly
        if ($LASTEXITCODE -ne 0) {
          throw "SDK installation failed."
        }

    - name: ⚙ Install Azure Artifacts credential provider
      shell: pwsh
      run: ./tools/Install-NuGetCredProvider.ps1

    - name: 🔐 Authenticate to Azure
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        allow-no-subscriptions: true

    - name: 🚀 Push NuGet packages to Azure Artifacts
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # 499b84ac-1321-427f-aa17-267ca6975798 is the Azure DevOps application id.
        $accessToken = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken --output tsv
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
          throw "Failed to acquire an Azure DevOps access token."
        }

        $accessToken = $accessToken.Trim()
        Write-Host "::add-mask::$accessToken"
        $env:VSS_NUGET_ACCESSTOKEN = $accessToken
        $env:ARTIFACTS_CREDENTIALPROVIDER_ACCESSTOKEN = $accessToken
        $env:VSS_NUGET_URI_PREFIXES = 'https://pkgs.dev.azure.com/andrewarnott/'
        $env:ARTIFACTS_CREDENTIALPROVIDER_URI_PREFIXES = 'https://pkgs.dev.azure.com/andrewarnott/'

        dotnet nuget push deployables/NuGet/*.nupkg --source https://pkgs.dev.azure.com/andrewarnott/OSS/_packaging/PublicCI/nuget/v3/index.json --api-key AzureDevOps --skip-duplicate
        if ($LASTEXITCODE -ne 0) {
          throw "Azure Artifacts push failed."
        }

  analyze:
    name: 🕵️‍♂️ Analyze
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        submodules: true

    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites -NoRust
        dotnet --info
      shell: pwsh

    - name: 📚 Verify docfx build
      run: dotnet docfx docfx/docfx.json --warningsAsErrors --disableGitFeatures

    - name: 💅🏻 Verify formatted code
      run: dotnet format --verify-no-changes --no-restore

  docs:
    name: 📃 Docs
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 🔗 Markup Link Checker (mlc)
      uses: becheran/mlc@d791bd6ae91ea883f02172e21f453ba8da45dfcd # v1.3.0
